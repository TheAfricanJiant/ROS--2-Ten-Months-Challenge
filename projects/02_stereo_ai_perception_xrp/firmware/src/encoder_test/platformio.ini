; Phase 1 test project: verify the motor encoders count correctly.
; Standalone on purpose - no micro-ROS, no ROS 2, no network.
;
; Uses the earlephilhower Arduino core for Serial.printf() and its
; interrupt/PWM behaviour on RP2040.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

; Set XRP_BOARD in src/main.cpp to match your board revision.
; For the RP2350B XRP Controller, use board = rpipico2 instead.
