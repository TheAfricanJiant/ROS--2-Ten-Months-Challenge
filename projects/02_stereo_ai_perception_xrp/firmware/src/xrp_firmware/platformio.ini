; XRP firmware - micro-ROS bridge between ROS 2 and the robot.

;; micro_ros_platformio builds the micro-ROS library from source using shell
;; scripts that need a POSIX shell, so a native Windows build fails with:
;;     '.' is not recognized as an internal or external command
;; Build under WSL on Windows, or natively on Linux/macOS. Full steps are in
;; 'build process.md' next to this file.
;;
;; Prebuilt firmware.uf2 is committed, so flashing needs no build at all.
;;
;; The three test projects build fine natively on Windows - they have no
;; micro-ROS dependency.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

lib_deps = 
	https://github.com/micro-ROS/micro_ros_platformio
    
; Match the distro your agent runs. Check with: echo $ROS_DISTRO
board_microros_distro = jazzy

; USB serial to the Pi 5. On the Pi:
;   ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/ttyACM0 -b 115200
board_microros_transport = serial

build_flags =
    -D CONTROL_HZ=50

; For the RP2350B XRP Controller: board = rpipico2


; -----------------------------------------------------------------------------
; WINDOWS PATH LENGTH
;
; micro-ROS clones a deep tree of git repositories while building. On Windows
; that overruns the 260-character MAX_PATH limit and the build dies with:
;
;     fatal: cannot write keep file '...pack-....keep': Filename too long
;
; The fix is in the firmware README ("Filename too long on Windows"). The short
; version, which needs no admin:
;
;     git config --global core.longpaths true
;
; If that is not enough, move the build tree somewhere short by setting these
; before building - as environment variables, NOT here, so the Pi is unaffected:
;
;     PowerShell:  $env:PLATFORMIO_LIBDEPS_DIR = "C:\pio\libdeps"
;                  $env:PLATFORMIO_BUILD_DIR   = "C:\pio\build"
;
; Building on the Raspberry Pi avoids the problem entirely - Linux has no such
; limit.
; -----------------------------------------------------------------------------
