; XRP firmware - micro-ROS bridge between ROS 2 and the robot.
;
; Same Arduino core as the phase 1 test projects, so the drivers carried over
; from them behave identically.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

; Match the distro your agent runs. Check with: echo $ROS_DISTRO
board_microros_distro = jazzy

; USB serial to the Pi 5. On the Pi:
;   ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/ttyACM0 -b 115200
board_microros_transport = serial

; micro-ROS needs a bigger stack than the Arduino default, and the message
; pool has to hold the largest message we publish (Odometry).
build_flags =
    -D CONTROL_HZ=50

; For the RP2350B XRP Controller: board = rpipico2
