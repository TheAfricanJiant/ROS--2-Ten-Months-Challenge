; Phase 1 test project: find every I2C device on the XRP board.
; Standalone on purpose - it shares nothing with the micro-ROS firmware.
;
; Uses the earlephilhower Arduino core rather than the default mbed one,
; because this sketch needs Wire.setSDA()/setSCL(), a second Wire1 bus, and
; Serial.printf() - none of which the mbed core provides.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

; The XRP Beta carries a Pico W. `pico` is fine here since nothing touches
; Wi-Fi; switch to `rpipicow` if you later add networking.
; For the RP2350B XRP Controller, use board = rpipico2 instead.
